<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Notes App</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #1a2a6c, #2d4373); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; padding: 1rem; text-align: center; }
    .box { max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; color: #f1c40f; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { opacity: 0.85; font-size: 0.95rem; margin-bottom: 1.5rem; }
    button { background: #f1c40f; color: #1a2a6c; border: none; padding: 0.8rem 2rem; border-radius: 30px; font-weight: 600; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Connect to the internet (mobile data or Wi-Fi) to load your notes.</p>
    <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
